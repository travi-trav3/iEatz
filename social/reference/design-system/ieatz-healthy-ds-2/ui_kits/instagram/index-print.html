<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iEatz Healthy — Instagram Templates (Print)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="ig.css">
<style>
  /* ─── Screen preview ─── */
  body { margin:0; padding:0; background:#ECEAE0; }
  .ig-stage { padding: 24px; gap: 24px; background: #ECEAE0; }
  /* Override the screen-time scaling — show each slide at 1:1 in flow */
  .ig-slide {
    transform: none !important;
    margin: 0 !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border-radius: 0;
  }

  /* ─── Print ─── */
  @page {
    size: 1080px 1350px;
    margin: 0;
  }
  @media print {
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
    body * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .ig-stage {
      display: block !important;
      padding: 0 !important;
      gap: 0 !important;
      background: #fff !important;
    }
    .ig-slide {
      width: 1080px !important;
      height: 1350px !important;
      transform: none !important;
      margin: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .ig-slide:last-child {
      page-break-after: auto;
      break-after: auto;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="IGBadge.jsx"></script>
<script type="text/babel" src="IGSlide.jsx"></script>
<script type="text/babel" src="AppStoreBadge.jsx"></script>
<script type="text/babel" src="Templates.jsx"></script>

<script type="text/babel">
function PrintStage() {
  // Force 1:1 — no scaling for print
  return (
    <div className="ig-stage" style={{ "--ig-scale": 1 }}>
      <TplEditorialTitle/>
      <TplBigStat/>
      <TplThreeSteps/>
      <TplRecipeHero/>
      <TplQuote/>
      <TplCTA/>
      <TplMythHook/>
      <TplListSidePhoto/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<PrintStage/>);

// Auto-print once fonts + JSX components have rendered.
(async () => {
  // Wait for fonts to load
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  // Wait for any images inside slides
  await Promise.all(
    Array.from(document.images)
      .filter(img => !img.complete)
      .map(img => new Promise(res => { img.onload = img.onerror = res; }))
  );
  // Final safety buffer for Babel-rendered React tree to settle
  await new Promise(r => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
