<!doctype html>
<!-- @dsCard group="UI Kit — Instagram" name="Instagram UI kit" subtitle="1080×1350 templates — 6 base layouts" viewport="1280x720" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>iEatz Healthy — Instagram Templates</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="ig.css">
<style>
  body { margin:0; padding:0; background:#ECEAE0; }
  .header {
    padding:48px 64px 24px;
    font-family:var(--font-sans);
  }
  .header h1 { font-family:var(--font-serif); font-size:40px; font-weight:500; margin:0; color:var(--ink-1); font-variation-settings:'opsz' 36; letter-spacing:-0.01em; }
  .header p { font-size:15px; color:var(--ink-3); margin:8px 0 0; max-width:640px; line-height:1.5; }
  .pad-bottom { height:48px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="header">
  <h1>Instagram Templates</h1>
  <p>1080×1350 (4:5 portrait) — feed posts and carousels. Eight base templates; mix and match for full carousels. Every slide carries the brand badge.</p>
</div>
<div id="root"></div>
<div class="pad-bottom"></div>

<script type="text/babel" src="IGBadge.jsx"></script>
<script type="text/babel" src="IGSlide.jsx"></script>
<script type="text/babel" src="app-store-badge.jsx"></script>
<script type="text/babel" src="Templates.jsx"></script>
<script type="text/babel">
function Stage() {
  const [scale, setScale] = React.useState(() => {
    const w = window.innerWidth - 96;
    // Two slides per row with 40px gap, accounting for padding (80px total)
    const available = (w - 40) / 2;
    return Math.min(0.5, Math.max(0.28, available / 1080));
  });
  React.useEffect(() => {
    const onR = () => {
      const w = window.innerWidth - 96;
      const available = (w - 40) / 2;
      setScale(Math.min(0.5, Math.max(0.28, available / 1080)));
    };
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return (
    <div className="ig-stage" style={{ "--ig-scale": scale }}>
      <TplEditorialTitle/>
      <TplBigStat/>
      <TplThreeSteps/>
      <TplRecipeHero/>
      <TplQuote/>
      <TplCTA/>
      <TplMythHook/>
      <TplListSidePhoto/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Stage/>);
</script>
</body>
</html>
