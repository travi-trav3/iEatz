<!doctype html>
<!-- @dsCard group="Brand" name="Post · Eat This, Not That" subtitle="Bowl vs pasta · split-tile comparison" viewport="1080x1350" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>iEatz · Eat This, Not That — salad vs milkshake</title>
<link rel="stylesheet" href="_post.css">
<style>
  .p4 { background: var(--paper); }
  .p4 .top {
    position:absolute; top:80px; left:80px; right:80px;
    display:flex; flex-direction:column; gap:18px;
    z-index:3;
  }
  .p4 .top .head {
    font-family: var(--font-serif);
    font-size: 68px;
    font-weight: 400;
    line-height: 1.02;
    letter-spacing: -0.012em;
    color: var(--ink-1);
    text-wrap: balance;
    max-width: 880px;
  }
  .p4 .top .head em { color: var(--brand-green); font-style: italic; }

  /* Two-tile comparison */
  .p4 .tiles {
    position:absolute; top:300px; left:80px; right:80px; bottom:240px;
    display:grid; grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .p4 .tile {
    position:relative; overflow:hidden;
    border-radius: 36px;
  }
  .p4 .tile.this  { background: url("../assets/photos/food/buddha-bowl.jpg") center/cover no-repeat; }
  .p4 .tile.that  { background: url("../assets/photos/food/pesto-pasta-bowl.jpg") center/cover no-repeat; }
  .p4 .tile::after {
    content:""; position:absolute; inset:auto 0 0 0; height:55%;
    background: linear-gradient(180deg, rgba(8,49,27,0) 0%, rgba(8,49,27,0.85) 75%, rgba(8,49,27,0.92) 100%);
  }
  .p4 .tile .lbl {
    position:absolute; left:32px; right:32px; bottom:32px; z-index:2;
    display:flex; flex-direction:column; gap:14px;
  }
  .p4 .tile .verdict {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .p4 .tile.this .verdict { color: #9FE4B3; }
  .p4 .tile.that .verdict { color: #F7C5BC; }
  .p4 .tile .name {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 400;
    line-height: 1.0;
    color: var(--paper);
    letter-spacing: -0.012em;
    text-wrap: balance;
  }
  .p4 .tile .stats {
    font-family: var(--font-mono);
    font-size: 18px;
    color: rgba(245,242,234,0.78);
    letter-spacing: 0.02em;
  }

  /* Center pivot tag */
  .p4 .pivot {
    position:absolute; left:50%; top: 470px; transform: translate(-50%, -50%);
    z-index:5;
    background: var(--paper);
    padding: 14px 22px;
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
</style>
</head>
<body>
<div class="stage"><div class="fit"><section class="post p4" data-screen-label="04 Eat This Not That">

  <div class="top">
    <span class="eyebrow">Eat this · not that</span>
    <h1 class="head">The salad that's basically <em>a milkshake</em>. And the one that isn't.</h1>
  </div>

  <div class="tiles">
    <div class="tile this">
      <div class="lbl">
        <span class="verdict">↑ eat this</span>
        <span class="name">Chickpea &amp; sweet-potato bowl</span>
        <span class="stats">420 cal · 22g protein · $4.10</span>
      </div>
    </div>
    <div class="tile that">
      <div class="lbl">
        <span class="verdict">↓ not that</span>
        <span class="name">Creamy-pesto deli pasta</span>
        <span class="stats">820 cal · 11g protein · $12.50</span>
      </div>
    </div>
  </div>

  <div class="pivot">vs.</div>

  <div class="badge">
    <svg viewBox="0 0 38.25 58.486" fill="currentColor"><path d="M0 5.03C0 2.252 2.252 0 5.03 0H33.22C35.998 0 38.25 2.252 38.25 5.03V20.119H0V5.03Z"/><path d="M0 49.83C0 52.608 2.252 54.86 5.03 54.86H33.22C35.998 54.86 38.25 52.608 38.25 49.83V22.81H0V49.83Z"/><path d="M6.083 6.2C6.083 5.489 6.659 4.913 7.369 4.913 8.08 4.913 8.656 5.489 8.656 6.2V16.259C8.656 16.97 8.08 17.546 7.369 17.546 6.659 17.546 6.083 16.97 6.083 16.259Z"/><path d="M6.083 26.787C6.083 26.076 6.659 25.5 7.369 25.5 8.08 25.5 8.656 26.076 8.656 26.787V36.846C8.656 37.557 8.08 38.133 7.369 38.133 6.659 38.133 6.083 37.557 6.083 36.846Z"/><path d="M5.264 54.86H10.878L9.892 57.771C9.748 58.199 9.347 58.486 8.895 58.486H7.2C6.743 58.486 6.338 58.192 6.198 57.757Z"/><path d="M27.489 54.86H33.103L32.117 57.771C31.972 58.199 31.571 58.486 31.12 58.486H29.425C28.968 58.486 28.563 58.192 28.423 57.757Z"/></svg>
    <span class="wm">iEatz Healthy</span>
  </div>

</section></div></div>
<script>
(function fit(){
  function go(){
    const f = document.querySelector('.fit');
    const w = Math.min(window.innerWidth - 48, 1080);
    const s = w / 1080;
    f.style.width = (1080*s)+'px';
    f.style.height = (1350*s)+'px';
    f.querySelector('.post').style.transform = `scale(${s})`;
  }
  go(); window.addEventListener('resize', go);
})();
</script>
</body></html>
