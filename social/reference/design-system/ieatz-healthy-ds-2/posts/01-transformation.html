<!doctype html>
<!-- @dsCard group="Brand" name="Post · The Transformation" subtitle="Cutting-board hero · 'tonight's dinner is already in your fridge'" viewport="1080x1350" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>iEatz · The Transformation — Tonight's dinner is already in your fridge</title>
<link rel="stylesheet" href="_post.css">
<style>
  .p1 { background: var(--paper); }
  .p1 .photo {
    position:absolute; top:0; left:0; right:0; height:620px;
    background: url("../assets/photos/food/cutting-board-veg.jpg") center 35%/cover no-repeat;
  }
  .p1 .photo::after {
    content:""; position:absolute; inset:auto 0 0 0; height:160px;
    background: linear-gradient(to bottom, rgba(245,242,234,0), var(--paper) 92%);
  }
  .p1 .corner-issue {
    position:absolute; top:80px; left:80px; right:80px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:2;
  }
  .p1 .corner-issue .label { color:#fff; text-shadow: 0 1px 8px rgba(0,0,0,.45); font-family: var(--font-sans); font-weight:600; font-size:20px; letter-spacing:.14em; text-transform:uppercase; }
  .p1 .corner-issue .num { color:#fff; text-shadow: 0 1px 8px rgba(0,0,0,.45); font-family: var(--font-serif); font-style: italic; font-size:36px; }

  .p1 .copy {
    position:absolute; top:680px; left:80px; right:80px;
    display:flex; flex-direction:column; gap:36px;
  }
  .p1 .headline {
    font-size:104px;
    line-height: 0.98;
  }
  .p1 .headline em {
    color: var(--brand-green);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="stage"><div class="fit"><section class="post p1" data-screen-label="01 The Transformation">

  <div class="photo"></div>

  <div class="corner-issue">
    <span class="label">Eating well · 04</span>
    <span class="num">No. 14</span>
  </div>

  <div class="copy">
    <span class="accent-bar"></span>
    <h1 class="headline">Tonight's dinner is <em>already</em> in your fridge.</h1>
    <p class="body" style="max-width:820px;">Three things. One photo. Dinner in fifteen — pulled from what you already have, not a shopping list someone wrote in 2019.</p>

    <span class="wm">iEatz Healthy</span>
  </div>

</section></div></div>
<script>
(function fit(){
  function go(){
    const f = document.querySelector('.fit');
    const w = Math.min(window.innerWidth - 48, 1080);
    const s = w / 1080;
    f.style.width = (1080*s)+'px';
    f.style.height = (1350*s)+'px';
    f.querySelector('.post').style.transform = `scale(${s})`;
  }
  go(); window.addEventListener('resize', go);
})();
</script>
</body></html>
