<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>iEatz · The Life You Get Back</title>
<link rel="stylesheet" href="_post.css">
<style>
  .p3 { background: var(--ink-1); }
  .p3 .photo {
    position:absolute; inset:0;
    background: url("../assets/photos/lifestyle/couple-cooking.jpg") center 30%/cover no-repeat;
  }
  .p3 .photo::after {
    content:""; position:absolute; inset:0;

      linear-gradient(180deg, rgba(10,15,12,0.18) 0%, rgba(10,15,12,0) 22%);
  }
  .p3 .copy {
    position:absolute; left:80px; right:80px; bottom:240px;
    z-index:2;
    display:flex; flex-direction:column; gap:34px;
  }
  .p3 .eyebrow {
    color: var(--brand-green-light);
    opacity: 0.95;
  }
  .p3 .headline {
    color: var(--paper);
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: -0.018em;
  }
  .p3 .headline em {
    color: #9FE4B3;
    font-style: italic;
  }
  .p3 .attr {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--brand-green-light);
    opacity: 0.8;
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="stage"><div class="fit"><section class="post p3" data-screen-label="03 Life You Get Back">

  <div class="photo"></div>

<script>
(function fit(){
  function go(){
    const f = document.querySelector('.fit');
    const w = Math.min(window.innerWidth - 48, 1080);
    const s = w / 1080;
    f.style.width = (1080*s)+'px';
    f.style.height = (1350*s)+'px';
    f.querySelector('.post').style.transform = `scale(${s})`;
  }
  go(); window.addEventListener('resize', go);
})();
</script>
