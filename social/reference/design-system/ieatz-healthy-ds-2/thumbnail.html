<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--ie-green-dark);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main span{font-family:var(--ie-font-display);font-weight:400;font-size:150px;line-height:0.9;letter-spacing:-0.02em;color:var(--ie-paper);text-align:center}
  .main span em{font-style:italic;color:#9FE4B3}
  .strip{width:230px;display:flex;flex-direction:column}
  .strip i{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><span>iEatz<br><em>Healthy</em></span></div>
  <div class="strip">
    <i style="background:#E4A93C"></i>
    <i style="background:#1F8B4C"></i>
    <i style="background:#C9412B"></i>
    <i style="background:#4A2E4D"></i>
  </div>
</div>
</body>
</html>
