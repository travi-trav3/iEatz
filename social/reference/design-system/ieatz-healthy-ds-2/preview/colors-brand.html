<!doctype html>
<!-- @dsCard group="Colors" name="Brand greens" subtitle="Primary green scale + mark-green" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--paper-light); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .swatch { width:120px; }
  .chip { height:96px; border-radius:14px; box-shadow: inset 0 0 0 1px rgba(14,74,42,0.06); }
  .meta { margin-top:8px; font-family:var(--font-sans); }
  .name { font-size:13px; font-weight:600; color:var(--ink-1); letter-spacing:0.01em;}
  .hex  { font-size:12px; color:var(--ink-4); font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#1F8B4C"></div><div class="meta"><div class="name">brand-green</div><div class="hex">#1F8B4C</div></div></div>
  <div class="swatch"><div class="chip" style="background:#0E4A2A"></div><div class="meta"><div class="name">brand-green-dark</div><div class="hex">#0E4A2A</div></div></div>
  <div class="swatch"><div class="chip" style="background:#61CA8C"></div><div class="meta"><div class="name">brand-mark-green</div><div class="hex">#61CA8C</div></div></div>
  <div class="swatch"><div class="chip" style="background:#E6F4EC"></div><div class="meta"><div class="name">brand-green-light</div><div class="hex">#E6F4EC</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F2FAF6"></div><div class="meta"><div class="name">brand-mint</div><div class="hex">#F2FAF6</div></div></div>
</div>
</body></html>
