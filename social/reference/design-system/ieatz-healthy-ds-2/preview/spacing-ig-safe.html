<!doctype html>
<!-- @dsCard group="Spacing" name="IG safe zone" subtitle="80px edges + bottom 15% no-text rule" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--paper); }
  .frame { position:relative; width:540px; height:675px; margin:0 auto; background:var(--paper-light); border:1px solid var(--ink-5); }
  /* 80px safe zone scaled to 40px at this 0.5x */
  .safe { position:absolute; inset:40px; border:1px dashed var(--brand-green); border-radius:4px; }
  .bottom { position:absolute; left:0; right:0; bottom:0; height:15%; background:rgba(178,58,72,0.08); border-top:1px dashed var(--signal-error); }
  .badge { position:absolute; left:48px; bottom:48px; font-family:var(--font-sans); font-size:11px; color:var(--ink-4); }
  .label { position:absolute; left:48px; top:48px; font-family:var(--font-sans); font-size:11px; color:var(--brand-green); letter-spacing:0.08em; text-transform:uppercase; }
  .x-label { position:absolute; right:48px; bottom:4%; font-family:var(--font-sans); font-size:11px; color:var(--signal-error); }
</style></head><body>
<div class="frame">
  <div class="safe"></div>
  <div class="bottom"></div>
  <div class="label">80px safe zone</div>
  <div class="badge">1080 × 1350</div>
  <div class="x-label">No critical text in bottom 15%</div>
</div>
</body></html>
