<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow system" subtitle="Multi-layer, green-tinted (never gray)" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); display:flex; gap:28px; flex-wrap:wrap;}
  .card { background:var(--white); width:160px; height:120px; border-radius:16px; display:flex; align-items:flex-end; padding:14px; font-family:var(--font-sans); font-size:11px; color:var(--ink-3); font-weight:600; }
  .sm { box-shadow: 0 1px 2px rgba(14,74,42,0.04), 0 2px 6px rgba(14,74,42,0.05); }
  .md { box-shadow: 0 2px 6px rgba(14,74,42,0.05), 0 8px 24px rgba(14,74,42,0.07); }
  .lg { box-shadow: 0 4px 12px rgba(14,74,42,0.06), 0 16px 40px rgba(14,74,42,0.10), 0 32px 72px rgba(14,74,42,0.06); }
</style></head><body>
  <div class="card sm">shadow-sm</div>
  <div class="card md">shadow-md</div>
  <div class="card lg">shadow-lg</div>
</body></html>
