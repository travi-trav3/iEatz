<!doctype html>
<!-- @dsCard group="Brand" name="Voice & tone" subtitle="Headline + body voice example" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); }
  .voice { font-family:var(--font-serif); font-size:30px; font-weight:500; color:var(--ink-1); line-height:1.15; max-width:580px; }
  .voice em { color:var(--brand-green); font-style: italic; }
  .meta { margin-top:16px; font-family:var(--font-sans); font-size:13px; color:var(--ink-4); letter-spacing:0.04em; }
  .row { margin-bottom:24px;}
  small { color:var(--ink-4); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;}
</style></head><body>
<div class="row">
  <small>Headline voice</small>
  <div class="voice">Cook with what's <em>already there.</em></div>
</div>
<div class="row">
  <small>Body voice</small>
  <div class="voice" style="font-family:var(--font-sans); font-size:18px; font-weight:400; color:var(--ink-3);">Three ingredients. One photo. Dinner in fifteen.</div>
</div>
</body></html>
