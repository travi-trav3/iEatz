<!doctype html>
<!-- @dsCard group="Colors" name="Ink scale" subtitle="5-step ink ladder for text" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--paper-light); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .swatch { width:120px; }
  .chip { height:96px; border-radius:14px; box-shadow: inset 0 0 0 1px rgba(14,74,42,0.08); }
  .meta { margin-top:8px; font-family:var(--font-sans); }
  .name { font-size:13px; font-weight:600; color:var(--ink-1); }
  .hex  { font-size:12px; color:var(--ink-4); font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#0A0F0C"></div><div class="meta"><div class="name">ink-1</div><div class="hex">#0A0F0C</div></div></div>
  <div class="swatch"><div class="chip" style="background:#1D2520"></div><div class="meta"><div class="name">ink-2</div><div class="hex">#1D2520</div></div></div>
  <div class="swatch"><div class="chip" style="background:#5C625E"></div><div class="meta"><div class="name">ink-3</div><div class="hex">#5C625E</div></div></div>
  <div class="swatch"><div class="chip" style="background:#9CA29F"></div><div class="meta"><div class="name">ink-4</div><div class="hex">#9CA29F</div></div></div>
  <div class="swatch"><div class="chip" style="background:#C9CFC9"></div><div class="meta"><div class="name">ink-5</div><div class="hex">#C9CFC9</div></div></div>
</div>
</body></html>
