<!doctype html>
<!-- @dsCard group="Type" name="The stat treatment" subtitle="Instrument Serif italic — the brand's hero number" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); display:flex; gap:48px; align-items:center; justify-content:center; }
  .stat { font-family:var(--font-serif); font-style:italic; font-weight:400; color:var(--brand-green); line-height:0.9; letter-spacing:-0.03em; }
  .stat-1 { font-size:96px; }
  .stat-2 { font-size:72px; }
  .stat-3 { font-size:48px; }
  .lbl    { font-family:var(--font-sans); font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-4); margin-top:8px; }
  .col { text-align:center; }
</style></head><body>
  <div class="col"><div class="stat stat-1">12<span style="color:var(--ink-1);">m</span></div><div class="lbl">recipes generated</div></div>
  <div class="col"><div class="stat stat-2">$4.99</div><div class="lbl">pro / month</div></div>
  <div class="col"><div class="stat stat-3">300+</div><div class="lbl">per day</div></div>
</body></html>
