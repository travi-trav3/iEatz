<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4pt grid — s-1 → s-10" viewport="700x340" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background:var(--paper-light); }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:12px; align-items:end; }
  .cell { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .box  { background:var(--brand-green); border-radius:6px; width:100%; }
  .label { font-family:var(--font-sans); font-size:11px; color:var(--ink-3); }
  .name  { font-family:var(--font-sans); font-size:11px; color:var(--ink-1); font-weight:600;}
  .px    { color:var(--ink-4); }
</style></head><body>
<div class="grid">
  <div class="cell"><div class="box"  style="height:4px"></div><div class="name">s-1</div><div class="label px">4</div></div>
  <div class="cell"><div class="box"  style="height:8px"></div><div class="name">s-2</div><div class="label px">8</div></div>
  <div class="cell"><div class="box"  style="height:12px"></div><div class="name">s-3</div><div class="label px">12</div></div>
  <div class="cell"><div class="box"  style="height:16px"></div><div class="name">s-4</div><div class="label px">16</div></div>
  <div class="cell"><div class="box"  style="height:24px"></div><div class="name">s-5</div><div class="label px">24</div></div>
  <div class="cell"><div class="box"  style="height:32px"></div><div class="name">s-6</div><div class="label px">32</div></div>
  <div class="cell"><div class="box"  style="height:48px"></div><div class="name">s-7</div><div class="label px">48</div></div>
</div>
</body></html>
