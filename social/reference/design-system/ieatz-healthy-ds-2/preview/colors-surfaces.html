<!doctype html>
<!-- @dsCard group="Colors" name="Surfaces" subtitle="Paper, paper-light, mint, white — never pure white in marketing" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#FFF; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .swatch { width:140px; }
  .chip { height:96px; border-radius:14px; box-shadow: inset 0 0 0 1px rgba(14,74,42,0.10); }
  .meta { margin-top:8px; font-family:var(--font-sans); }
  .name { font-size:13px; font-weight:600; color:var(--ink-1); }
  .hex  { font-size:12px; color:var(--ink-4); font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#F5F2EA"></div><div class="meta"><div class="name">paper (default)</div><div class="hex">#F5F2EA</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FBFAF6"></div><div class="meta"><div class="name">paper-light</div><div class="hex">#FBFAF6</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">white / card</div><div class="hex">#FFFFFF</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F1FCF3"></div><div class="meta"><div class="name">app-mint-bg</div><div class="hex">#F1FCF3</div></div></div>
</div>
</body></html>
