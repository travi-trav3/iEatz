<!doctype html>
<!-- @dsCard group="Type" name="Display type" subtitle="Instrument Serif — hero through h2" viewport="700x380" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background:var(--paper-light); }
  .stack { display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:baseline; gap:24px; }
  .label { width:120px; flex-shrink:0; font-family:var(--font-sans); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-4); padding-top:6px;}
  .specimen {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-style: normal;
    color: var(--ink-1);
    letter-spacing: -0.005em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .display { font-size:64px; line-height:1.0; letter-spacing:-0.01em; }
  .h1      { font-size:44px; }
  .h2      { font-size:30px; line-height:1.1; }
  em       { font-style: normal; color: var(--brand-green); }
</style></head><body>
<div class="stack">
  <div class="row"><div class="label">Display · 120</div><div class="specimen display">A pantry-first kind of <em>healthy</em>.</div></div>
  <div class="row"><div class="label">H1 · 84</div><div class="specimen h1">Tonight's dinner from what you already have.</div></div>
  <div class="row"><div class="label">H2 · 56</div><div class="specimen h2">Open the fridge. Snap. Cook.</div></div>
</div>
</body></html>
