<!doctype html>
<!-- @dsCard group="Brand" name="Favicon" subtitle="Fridge mark for browser tabs" viewport="700x420" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="icon" href="../assets/brand/favicon-tile.svg">
<style>
body{margin:0;padding:36px;background:var(--paper);font-family:'Inter Tight',sans-serif;color:var(--ink-1);display:flex;flex-direction:column;gap:28px}
h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.row{display:flex;align-items:flex-end;gap:32px}
.spec{display:flex;flex-direction:column;align-items:center;gap:8px}
.spec small{font-size:11px;color:var(--ink-2)}
.tab{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:10px 10px 0 0;padding:10px 16px;box-shadow:var(--shadow-sm);width:200px}
.tab img{width:16px;height:16px}
.tab span{font-size:13px;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
pre{margin:0;background:var(--white);border-radius:12px;padding:16px 18px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;color:var(--ink-1);overflow-x:auto;box-shadow:var(--shadow-sm)}
</style></head><body>
<div><h3>Sizes</h3><div class="row" style="margin-top:14px">
<div class="spec"><img src="../assets/brand/favicon-16.png" width="16" height="16" alt=""><small>16</small></div>
<div class="spec"><img src="../assets/brand/favicon-32.png" width="32" height="32" alt=""><small>32</small></div>
<div class="spec"><img src="../assets/brand/favicon-48.png" width="48" height="48" alt=""><small>48</small></div>
<div class="spec"><img src="../assets/brand/favicon-tile.svg" width="64" height="64" alt=""><small>64 svg</small></div>
<div class="spec"><img src="../assets/brand/favicon.svg" width="64" height="64" alt=""><small>transparent</small></div>
<div class="spec"><img src="../assets/brand/apple-touch-icon.png" width="80" height="80" style="border-radius:18px" alt=""><small>touch icon</small></div>
</div></div>
<div><h3>In a tab</h3><div class="row" style="margin-top:14px"><div class="tab"><img src="../assets/brand/favicon-tile.svg" alt=""><span>iEatz Healthy</span></div></div></div>
<div><h3>Embed</h3><pre>&lt;link rel="icon" href="/assets/brand/favicon-tile.svg" type="image/svg+xml"&gt;
&lt;link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32"&gt;
&lt;link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"&gt;</pre></div>
</body></html>
