<!doctype html>
<!-- @dsCard group="Components" name="Brand badge" subtitle="Always present on every IG slide" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); display:flex; flex-direction:column; gap:18px;}
  .badge { display:inline-flex; align-items:center; gap:10px; }
  .mark  { width:18px; height:auto; color:var(--brand-green); }
  .word  { font-family:var(--font-sans); font-size:13px; font-weight:500; color:var(--ink-1); letter-spacing:0.01em; }
  .row { display:flex; align-items:center; gap:36px; }
  .panel { background:var(--paper-light); padding:18px 22px; border-radius:14px; box-shadow:var(--shadow-sm); }
  .panel-dark { background:var(--brand-green-dark); padding:18px 22px; border-radius:14px;}
  .panel-dark .word { color:#fff; }
  .panel-dark .mark { color:#fff; }
  .label { font-family:var(--font-sans); font-size:11px; color:var(--ink-4); letter-spacing:0.08em; text-transform:uppercase; }
</style></head><body>
  <div class="row">
    <div><div class="label">Default · on paper</div>
    <div class="panel"><div class="badge">
      <svg class="mark" viewBox="0 0 38.25 58.486" fill="currentColor"><path d="M 0 5.03 C 0 2.252 2.252 0 5.03 0 L 33.22 0 C 35.998 0 38.25 2.252 38.25 5.03 L 38.25 20.119 L 0 20.119 L 0 5.03 Z"/><path d="M 0 49.83 C 0 52.608 2.252 54.86 5.03 54.86 L 33.22 54.86 C 35.998 54.86 38.25 52.608 38.25 49.83 L 38.25 22.81 L 0 22.81 L 0 49.83 Z"/><path d="M 6.083 6.2 C 6.083 5.489 6.659 4.913 7.369 4.913 C 8.08 4.913 8.656 5.489 8.656 6.2 L 8.656 16.259 C 8.656 16.97 8.08 17.546 7.369 17.546 C 6.659 17.546 6.083 16.97 6.083 16.259 L 6.083 6.2 Z"/><path d="M 6.083 26.787 C 6.083 26.076 6.659 25.5 7.369 25.5 C 8.08 26 8.656 26.076 8.656 26.787 L 8.656 36.846 C 8.656 37.557 8.08 38.133 7.369 38.133 C 6.659 38.133 6.083 37.557 6.083 36.846 L 6.083 26.787 Z"/></svg>
      <span class="word">iEatz Healthy</span>
    </div></div></div>
    <div><div class="label">Reverse · on green</div>
    <div class="panel-dark"><div class="badge">
      <svg class="mark" viewBox="0 0 38.25 58.486" fill="currentColor"><path d="M 0 5.03 C 0 2.252 2.252 0 5.03 0 L 33.22 0 C 35.998 0 38.25 2.252 38.25 5.03 L 38.25 20.119 L 0 20.119 L 0 5.03 Z"/><path d="M 0 49.83 C 0 52.608 2.252 54.86 5.03 54.86 L 33.22 54.86 C 35.998 54.86 38.25 52.608 38.25 49.83 L 38.25 22.81 L 0 22.81 L 0 49.83 Z"/></svg>
      <span class="word">iEatz Healthy</span>
    </div></div></div>
  </div>
  <div class="label">Always present on every post. Inter Tight 500 · 10–12px in print, ~22px on a 1080-wide IG canvas.</div>
</body></html>
