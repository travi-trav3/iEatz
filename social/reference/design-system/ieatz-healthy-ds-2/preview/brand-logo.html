<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Fridge mark + iEatz Healthy lockup" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); display:flex; gap:48px; align-items:center; flex-wrap:wrap;}
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup img { height:60px; }
  .stack { display:flex; flex-direction:column; line-height:1; gap:4px;}
  .stack span { font-family: 'Inter Tight', sans-serif; font-size:28px; color:var(--ink-1); }
  .stack .one { font-weight:700; }
  .stack .two { font-weight:500; }
  .badge-inline { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--white); border-radius:999px; box-shadow: var(--shadow-sm); }
  .badge-inline img { height:20px; }
  .badge-inline span { font-family:'Inter Tight', sans-serif; font-size:14px; font-weight:500; color:var(--ink-2); }
</style></head><body>
<div class="lockup">
  <img src="../assets/brand/logo-mark-green.svg" alt="">
  <div class="stack"><span class="one">iEatz</span><span class="two">Healthy</span></div>
</div>
<div class="badge-inline"><img src="../assets/brand/logo-mark-green.svg"><span>iEatz Healthy</span></div>
</body></html>
