<!doctype html>
<!-- @dsCard group="Type" name="Eyebrow" subtitle="ALL-CAPS magazine kicker" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background:var(--paper); display:flex; flex-direction:column; gap:24px; }
  .row { display:flex; gap:16px; align-items:center; }
  .eyebrow { font-family:var(--font-sans); font-size:13px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--brand-green); }
  .eyebrow.ink { color:var(--ink-3); }
  .badge { font-family:var(--font-sans); font-size:13px; font-weight:500; color:var(--ink-2); }
  .pill  { padding:6px 14px; border-radius:999px; background:var(--brand-green-light); color:var(--brand-green-dark); font-family:var(--font-sans); font-size:12px; font-weight:600; letter-spacing:0.02em; text-transform:uppercase;}
  .accent { display:block; width:56px; height:3px; border-radius:999px; background:var(--brand-green); }
</style></head><body>
  <div class="row"><div class="eyebrow">EATING WELL · ISSUE 04</div></div>
  <div class="row"><div class="eyebrow ink">RECIPES FROM YOUR FRIDGE</div></div>
  <div class="row"><div class="pill">Vegetarian</div><div class="pill">15 min</div><div class="pill">No-cook</div></div>
  <div class="row"><span class="accent"></span><div class="badge">iEatz Healthy</div></div>
</body></html>
