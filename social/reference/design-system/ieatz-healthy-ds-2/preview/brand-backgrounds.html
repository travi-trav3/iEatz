<!doctype html>
<!-- @dsCard group="Brand" name="Backgrounds" subtitle="Paper, mint, deep-green moments" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:var(--paper); }
  .row { display:flex; }
  .swatch { flex:1; height:140px; display:flex; align-items:flex-end; padding:18px; font-family:var(--font-sans); font-size:12px; font-weight:600; letter-spacing:0.05em; }
  .a { background:var(--paper);          color:var(--ink-3); }
  .b { background:var(--paper-light);    color:var(--ink-3); }
  .c { background:var(--brand-mint);     color:var(--ink-3); }
  .d { background:var(--brand-green-light); color:var(--brand-green-dark); }
  .e { background:var(--white);          color:var(--ink-3); box-shadow: inset 0 0 0 1px var(--ink-5); }
  .lab { padding:18px; font-family:var(--font-sans); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-4); border-top:1px solid var(--ink-5); }
</style></head><body>
<div class="row">
  <div class="swatch a">PAPER · DEFAULT</div>
  <div class="swatch b">PAPER LIGHT</div>
  <div class="swatch c">MINT</div>
  <div class="swatch d">GREEN-LIGHT</div>
  <div class="swatch e">WHITE</div>
</div>
<div class="lab">Stack two paper tones on a slide; reserve mint for ingredient cards and green-light for accent panels.</div>
</body></html>
