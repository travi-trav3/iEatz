<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="White, tint, paper, dark variants" viewport="700x360" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background:var(--paper); display:flex; gap:24px; flex-wrap:wrap;}
  .card { width:280px; background:var(--white); border-radius:24px; padding:20px; box-shadow:var(--shadow-md); }
  .photo { aspect-ratio:4/3; border-radius:16px; background:linear-gradient(135deg,#E6F4EC,#C9DFC9); display:flex; align-items:center; justify-content:center; color:var(--ink-4); font-family:var(--font-sans); font-size:12px; font-weight:500; letter-spacing:0.05em; text-transform:uppercase;}
  .meta { display:flex; gap:8px; margin:14px 0 8px; }
  .chip { font-family:var(--font-sans); font-size:11px; padding:4px 10px; background:var(--brand-green-light); color:var(--brand-green-dark); border-radius:999px; font-weight:600;}
  .title { font-family:var(--font-serif); font-size:22px; font-weight:500; line-height:1.15; color:var(--ink-1); margin:0; letter-spacing:-0.01em;}
  .sub { font-family:var(--font-sans); font-size:13px; color:var(--ink-3); margin:8px 0 0; }

  .ingredient { width:160px; background:var(--paper-light); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm); }
  .ingredient .ic { font-size:36px; }
  .ingredient .nm { font-family:var(--font-sans); font-weight:600; font-size:14px; color:var(--ink-1);}
  .ingredient .qty { font-family:var(--font-sans); font-size:12px; color:var(--ink-4); }
</style></head><body>
  <div class="card">
    <div class="photo">[ food photo ]</div>
    <div class="meta"><span class="chip">15 min</span><span class="chip">No-cook</span></div>
    <h3 class="title">Pantry-pulled green bowl with lemon-tahini.</h3>
    <p class="sub">Built from cucumber, chickpeas, and herbs.</p>
  </div>
  <div class="ingredient"><div class="ic">🥒</div><div class="nm">Cucumber</div><div class="qty">2 medium</div></div>
  <div class="ingredient"><div class="ic">🍅</div><div class="nm">Tomato</div><div class="qty">200 g</div></div>
</body></html>
