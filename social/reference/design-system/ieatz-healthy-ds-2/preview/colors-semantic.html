<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success, error, attention, decoration" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:var(--paper); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .swatch { width:120px; }
  .chip { height:96px; border-radius:14px; box-shadow: inset 0 0 0 1px rgba(14,74,42,0.08); }
  .meta { margin-top:8px; font-family:var(--font-sans); }
  .name { font-size:13px; font-weight:600; color:var(--ink-1); }
  .hex  { font-size:12px; color:var(--ink-4); font-variant-numeric: tabular-nums; }
  .note { width:100%; font-family:var(--font-sans); font-size:13px; color:var(--ink-3); margin-top:8px;}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#D98C2B"></div><div class="meta"><div class="name">signal-warn</div><div class="hex">#D98C2B</div></div></div>
  <div class="swatch"><div class="chip" style="background:#B23A48"></div><div class="meta"><div class="name">signal-error</div><div class="hex">#B23A48</div></div></div>
  <div class="swatch"><div class="chip" style="background:#2A6FA3"></div><div class="meta"><div class="name">signal-info</div><div class="hex">#2A6FA3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#3BBF4F"></div><div class="meta"><div class="name">app-green</div><div class="hex">#3BBF4F</div></div></div>
  <div class="swatch"><div class="chip" style="background:#193A19"></div><div class="meta"><div class="name">app-green-deep</div><div class="hex">#193A19</div></div></div>
  <div class="note">Semantic colors used <b>sparingly</b>, small scale only — never as a slide background fill.</div>
</div>
</body></html>
